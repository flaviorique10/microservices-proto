syntax = "proto3";

package shipping;

// Aponta para o seu repositório no GitHub para facilitar o go mod tidy depois
option go_package = "github.com/flaviorique10/microservices-proto/golang/shipping";

service ShippingService {
    rpc GetDeliveryTime(ShippingRequest) returns (ShippingResponse) {}
}

message ShippingItem {
    string product_code = 1;
    int32 quantity = 2;
}

message ShippingRequest {
    int64 order_id = 1;
    repeated ShippingItem items = 2;
}

message ShippingResponse {
    int64 order_id = 1;
    int32 delivery_days = 2;
}